version: 2
updates:
  # Actions are pinned by commit hash, so a repointed tag never moves them; these bumps are the only thing that does.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # .pre-commit-config.yaml pins its hook revisions the same way.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Groups split by dependency type: a mixed group reports as direct:production, which is never auto-merged.
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    groups:
      # @stryker-mutator/vitest-runner needs a matching core; listed first because Dependabot uses the first matching group.
      stryker-mutator:
        patterns:
          - "@stryker-mutator/*"
      patch-updates-dev:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
      patch-updates-prod:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
    cooldown:
      default-days: 7

  # A bump of @azure/msal-browser or leaflet fails verify-vendor until frontend/src/vendor/ is re-copied.
  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/e2e"
    schedule:
      interval: "weekly"
    groups:
      stryker-mutator:
        patterns:
          - "@stryker-mutator/*"
      patch-updates-dev:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
    cooldown:
      default-days: 7
