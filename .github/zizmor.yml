# deploy.yml installs Functions Core Tools globally (no lockfile); the gate's
# global CLIs are in .github/actions/start-local-stack, suppressed inline there.
rules:
  adhoc-packages:
    ignore:
      - deploy.yml
  # actionlint 1.7.12 rejects the `$/` self-repository syntax ("ref is missing")
  # and checks a composite action's inputs only for `./` paths. Re-enable once
  # actionlint understands `$/`.
  self-repository:
    disable: true
