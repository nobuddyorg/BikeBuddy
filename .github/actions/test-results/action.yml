name: Add JUnit test results to the job summary
description: Summarises one JUnit XML report in the job summary; no check run, no PR comment.

inputs:
  title:
    description: Heading of the results in the job summary.
    required: true
  files:
    description: JUnit XML report, relative to the workspace.
    required: true

runs:
  using: composite
  steps:
    - uses: EnricoMi/publish-unit-test-result-action/linux@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.20.0
      with:
        check_name: ${{ inputs.title }}
        files: ${{ inputs.files }}
        compare_to_earlier_commit: false
        comment_mode: off
        check_run: false
        test_changes_limit: 0
