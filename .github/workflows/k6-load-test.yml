name: Load test (k6)

# Manual only: a measurement, never a gate (docs/how-to/load-testing.md).
on:
  workflow_dispatch:
    inputs:
      flow:
        description: Script under load/ to run
        type: choice
        options: [smoke, browse, upload, edit, export]
        default: smoke
      profile:
        description: "Load shape and seed size: normal (everyday, 200 tours), peak (5x users, 500), stress (steps to 20x, 1,000)"
        type: choice
        options: [normal, peak, stress]
        default: normal

run-name: k6 ${{ inputs.flow }} (${{ inputs.profile }})

permissions:
  contents: read

jobs:
  load_test:
    name: k6 ${{ inputs.flow }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    # stress seeds 1,000 tours and runs nine minutes on a runner that also hosts the stack.
    timeout-minutes: 45
    # Always against a local stack started in this run: never the live app.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-packages
        with:
          packages: functions

      # docs/how-to/load-testing.md, "Backend report".
      - name: Enable backend profiling
        run: |
          {
            echo "LOAD_PROFILING=true"
            echo "languageWorkers__node__arguments=--cpu-prof --cpu-prof-dir=${GITHUB_WORKSPACE}/load-results/cpu"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/start-local-stack
        with:
          start-backend: "true"

      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: "2.3.0"

      # Same command a developer runs.
      - name: Run k6
        id: k6
        run: ./buddy.sh test load "$FLOW" --profile "$PROFILE"
        env:
          FLOW: ${{ inputs.flow }}
          PROFILE: ${{ inputs.profile }}
          FUNCTIONS_HOST_LOG: /tmp/func.log

      - name: Add the k6 and backend reports to the job summary
        if: ${{ !cancelled() && steps.k6.outcome != 'skipped' }}
        env:
          FLOW: ${{ inputs.flow }}
        run: |
          for report in "load-results/$FLOW.md" "load-results/$FLOW.backend.md"; do
            if [ ! -f "$report" ]; then
              echo "::error::$report is missing, so the run never reached it."
              exit 1
            fi
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done

      # The worker writes its --cpu-prof files only when it exits; no file after 30 s fails the report.
      - name: Add the CPU profile to the backend report
        if: ${{ !cancelled() && steps.k6.outcome != 'skipped' }}
        env:
          FLOW: ${{ inputs.flow }}
        run: |
          pkill -f "func start" || true
          for _ in $(seq 1 30); do
            compgen -G "load-results/cpu/*.cpuprofile" > /dev/null && break
            sleep 1
          done
          node load/backend-report.mjs "$FLOW" --log /tmp/func.log --cpu load-results/cpu > /dev/null
          sed -n '/^### CPU profile/,$p' "load-results/$FLOW.backend.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the k6 results
        if: ${{ !cancelled() && steps.k6.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-${{ inputs.flow }}-${{ inputs.profile }}
          path: load-results
          retention-days: 30

      - if: ${{ failure() }}
        run: tail -n 200 /tmp/func.log || true
