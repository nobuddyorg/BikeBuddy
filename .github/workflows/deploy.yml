name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Serialise deploys so two pushes can't run `tofu apply` concurrently and race
# the remote state lock. Never cancel an in-flight deploy mid-apply.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_ACCESS_KEY: ${{ secrets.TF_BACKEND_ACCESS_KEY }}

jobs:
  infrastructure:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    outputs:
      functions_url: ${{ steps.output.outputs.functions_url }}
      functions_app_name: ${{ steps.output.outputs.functions_app_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "~1.8"

      - name: OpenTofu init + apply
        run: ./buddy.sh infrastructure provision
        env:
          ENTRA_SUBDOMAIN: ${{ vars.ENTRA_SUBDOMAIN }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}

      - name: Capture outputs
        id: output
        run: |
          echo "functions_url=$(tofu output -raw functions_url)" >> "$GITHUB_OUTPUT"
          echo "functions_app_name=$(tofu output -raw functions_app_name)" >> "$GITHUB_OUTPUT"
        working-directory: infrastructure

  deploy-functions:
    name: Deploy Functions (Flex, remote build)
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          creds: >-
            {"clientId":"${{ secrets.ARM_CLIENT_ID }}",
             "clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.ARM_TENANT_ID }}"}

      # Flex Consumption deploys from its package container via the publish API.
      # functions-action's Kudu/zip path targets wwwroot and doesn't register on
      # Flex, so use Core Tools with a remote build (compiles sharp for Linux).
      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Publish (remote build)
        run: ./buddy.sh infrastructure publish-functions
        env:
          FUNCTIONS_APP_NAME: ${{ needs.infrastructure.outputs.functions_app_name }}

  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    needs: infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate config.js
        env:
          FUNCTIONS_URL: ${{ needs.infrastructure.outputs.functions_url }}
          ENTRA_SUBDOMAIN: ${{ vars.ENTRA_SUBDOMAIN }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
        run: ./buddy.sh infrastructure generate-config

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/src/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
