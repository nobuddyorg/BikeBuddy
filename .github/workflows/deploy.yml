name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# One apply at a time on the shared state (destroy.yml joins this group), never cancelled mid-apply.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_ACCESS_KEY: ${{ secrets.TF_BACKEND_ACCESS_KEY }}

jobs:
  infrastructure:
    name: OpenTofu Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      functions_url: ${{ steps.output.outputs.functions_url }}
      functions_app_name: ${{ steps.output.outputs.functions_app_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "~1.8"

      - name: OpenTofu init + apply
        run: ./buddy.sh infrastructure provision
        env:
          ENTRA_SUBDOMAIN: ${{ vars.ENTRA_SUBDOMAIN }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          TF_VAR_budget_contact_email: ${{ vars.BUDGET_CONTACT_EMAIL }}

      - name: Capture outputs
        id: output
        run: |
          echo "functions_url=$(tofu output -raw functions_url)" >> "$GITHUB_OUTPUT"
          echo "functions_app_name=$(tofu output -raw functions_app_name)" >> "$GITHUB_OUTPUT"
        working-directory: infrastructure

  deploy-functions:
    name: Deploy Functions (Flex, remote build)
    needs: infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: >-
            {"clientId":"${{ secrets.ARM_CLIENT_ID }}",
             "clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.ARM_TENANT_ID }}"}

      # Flex deploys through the publish API; functions-action's Kudu zip path does not register there.
      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4.13.0 --unsafe-perm true # zizmor: ignore[adhoc-packages] global CLI, no lockfile; same pin as start-local-stack

      - name: Publish (remote build)
        run: ./buddy.sh infrastructure publish-functions
        env:
          FUNCTIONS_APP_NAME: ${{ needs.infrastructure.outputs.functions_app_name }}

  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    needs: infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Generate config.js
        env:
          FUNCTIONS_URL: ${{ needs.infrastructure.outputs.functions_url }}
          ENTRA_SUBDOMAIN: ${{ vars.ENTRA_SUBDOMAIN }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
        run: ./buddy.sh infrastructure generate-config

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/src/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
