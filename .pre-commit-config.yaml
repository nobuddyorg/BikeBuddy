repos:
  # Standard file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
        # Vendored files stay byte-identical to upstream (verify-vendor below).
        exclude: ^frontend/src/vendor/
      - id: mixed-line-ending
        exclude: ^frontend/src/vendor/
      - id: trailing-whitespace
        exclude: ^frontend/src/vendor/
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # Spell checking
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.2
    hooks:
      - id: typos
        # Minified vendor code and non-English locale strings (also quoted in docs/superpowers/) trip it.
        exclude: ^(frontend/src/(vendor|locales)/|docs/superpowers/(plans|specs)/)

  # gitleaks: secrets, with Azure rules and the emulator-key allowlist in .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Staged changes only: `dir` mode ignores .gitignore and would flag a real local.settings.json.
      - id: gitleaks
      # Every commit reachable from HEAD; in CI's depth-1 checkout, the full tree of the tested commit.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (git history)
        entry: gitleaks git --redact --verbose

  # zizmor: GitHub Actions security. No --fix: a fix made in CI is discarded (run `zizmor --fix .github`).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  # actionlint: syntax, expression types, job references, composite-action inputs, ShellCheck on run: blocks.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Every workflow at once, so an edited composite action re-checks the workflows that call it.
        files: ^\.github/(workflows|actions)/
        pass_filenames: false

  # lockfile-lint: npm registry over https with integrity hashes; its own pinned install.
  - repo: local
    hooks:
      - id: lockfile-lint
        name: lockfile-lint
        entry: bash -c 'for lockfile in "$@"; do lockfile-lint --path "$lockfile" --type npm --allowed-hosts npm --validate-https --validate-integrity --validate-package-names || exit 1; done' --
        language: node
        additional_dependencies: ["lockfile-lint@5.0.1"]
        files: ^(functions|frontend|e2e)/package-lock\.json$

  # ESLint (functions/)
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'cd functions && npm run lint'
        language: system
        pass_filenames: false
        files: ^functions/(src|test|scripts)/|^functions/(eslint\.config\.js|package\.json)$
        stages: [pre-commit]

  # Prettier check (functions/) — auto-fix with: npm run format
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: bash -c "cd functions && npx prettier --check 'src/**/*.js' 'test/**/*.js' 'scripts/**/*.{js,mjs}'"
        language: system
        pass_filenames: false
        files: ^functions/(src|test|scripts)/
        stages: [pre-commit]

  # Prettier check (e2e/ TypeScript) — reuses functions' prettier; fix with: cd e2e && npm run format
  - repo: local
    hooks:
      - id: prettier-e2e
        name: Prettier (e2e)
        entry: bash -c "cd functions && npx prettier --check '../e2e/**/*.ts'"
        language: system
        pass_filenames: false
        files: ^e2e/.*\.ts$
        stages: [pre-commit]

  # ESLint (e2e/) — typescript-eslint type-checked + eslint-plugin-playwright.
  - repo: local
    hooks:
      - id: eslint-e2e
        name: ESLint (e2e)
        entry: bash -c 'cd e2e && npm run lint'
        language: system
        pass_filenames: false
        files: ^e2e/(.*\.ts|eslint\.config\.js|tsconfig\.json|package\.json)$
        stages: [pre-commit]

  # tsc --noEmit for e2e/ and the `// @ts-check` files of functions/ and frontend/.
  - repo: local
    hooks:
      - id: tsc
        name: TypeScript (functions + frontend @ts-check)
        entry: bash -c 'cd functions && npm run typecheck && cd ../frontend && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^(functions|frontend)/(src/.*\.js|scripts/.*\.js|tsconfig\.json)$
        exclude: ^frontend/src/vendor/
        stages: [pre-commit]
      - id: tsc-e2e
        name: TypeScript (e2e)
        entry: bash -c 'cd e2e && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^e2e/(.*\.ts|tsconfig\.json)$
        stages: [pre-commit]

  # dependency-cruiser: layer boundaries and cycles over the whole graph; rules in .dependency-cruiser.cjs.
  - repo: local
    hooks:
      - id: depcruise
        name: dependency-cruiser
        entry: bash -c 'cd functions && npm run --silent depcruise'
        language: system
        pass_filenames: false
        files: ^((functions|frontend)/(src|scripts|test)/.*\.(js|mjs)|e2e/.*\.(ts|mjs)|\.dependency-cruiser(-known-violations)?\.(cjs|json))$
        exclude: ^frontend/src/vendor/
        stages: [pre-commit]

  # Knip: unused files, exports and dependencies in all three packages.
  - repo: local
    hooks:
      - id: knip
        name: Knip (dead code and unused dependencies)
        entry: bash -c 'cd functions && npm run --silent knip'
        language: system
        pass_filenames: false
        files: ^((functions|frontend)/(src|scripts|test)/.*\.(js|mjs)|e2e/.*\.(ts|mjs)|load/.*\.(js|mjs)|(functions|frontend|e2e|load)/(package\.json|knip\.jsonc))$
        exclude: ^frontend/src/vendor/
        stages: [pre-commit]

  # Prettier check (load/, the k6 scripts) — reuses functions' prettier.
  - repo: local
    hooks:
      - id: eslint-load
        name: ESLint (load)
        entry: functions/node_modules/.bin/eslint --config functions/eslint.load.config.js --max-warnings 0 load
        language: system
        pass_filenames: false
        files: ^(load/.*\.(js|mjs)|functions/eslint\.load\.config\.js)$
        stages: [pre-commit]
      - id: prettier-load
        name: Prettier (load)
        entry: bash -c "cd functions && npx prettier --check --config .prettierrc.json '../load/**/*.{js,mjs}'"
        language: system
        pass_filenames: false
        files: ^load/.*\.(js|mjs)$
        stages: [pre-commit]
      - id: prettier-scripts
        name: Prettier (root scripts)
        entry: functions/node_modules/.bin/prettier --check --config functions/.prettierrc.json
        language: system
        files: ^(scripts/.*\.mjs|mutation-targets\.mjs)$
        stages: [pre-commit]

  # frontend/src/vendor/ byte-identical to the pinned npm packages; after a bump: node scripts/quality/verify-vendor.mjs --write
  - repo: local
    hooks:
      - id: verify-vendor
        name: Vendored libraries match frontend/node_modules
        entry: node scripts/quality/verify-vendor.mjs
        language: system
        pass_filenames: false
        files: ^(frontend/src/vendor/|frontend/package(-lock)?\.json$|scripts/quality/verify-vendor\.mjs$)
        stages: [pre-commit]

  # ESLint (frontend/): runs from the repo root so the files are inside ESLint's base path.
  - repo: local
    hooks:
      - id: eslint-frontend
        name: ESLint (frontend)
        entry: functions/node_modules/.bin/eslint --config functions/eslint.frontend.config.js --max-warnings 0 frontend/src frontend/test
        language: system
        pass_filenames: false
        files: ^frontend/(src|test)/.*\.js$
        exclude: ^frontend/src/vendor/
        stages: [pre-commit]

  # Prettier check (frontend/) — fix with: cd functions && npx prettier --write '../frontend/...'
  - repo: local
    hooks:
      - id: prettier-frontend
        name: Prettier (frontend)
        # frontend/ has no .prettierrc, and Prettier resolves config from each file's directory.
        entry: bash -c "cd functions && npx prettier --check --config .prettierrc.json '../frontend/*.js' '../frontend/src/*.{js,css,html}' '../frontend/src/{lib,ui}/**/*.js' '../frontend/src/css/*.css' '../frontend/test/**/*.js'"
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(js|css|html)$
        exclude: ^frontend/src/vendor/
        stages: [pre-commit]

  # ShellCheck (auto-installs in its own env).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # Prettier check (markdown) — the formatter for docs; fix with prettier --write.
  - repo: local
    hooks:
      - id: prettier-md
        name: Prettier (markdown)
        entry: functions/node_modules/.bin/prettier --check --config functions/.prettierrc.json
        language: system
        files: \.md$
        exclude: (^|/)node_modules/

  # markdownlint — linter for docs (config: .markdownlint-cli2.jsonc).
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # editorconfig-checker — enforce .editorconfig across the repo.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec

  # OpenTofu fmt + validate: needs the tofu CLI.
  - repo: local
    hooks:
      - id: tofu-fmt
        name: OpenTofu fmt
        entry: bash -c 'cd infrastructure && tofu fmt -check -recursive'
        language: system
        pass_filenames: false
        files: ^infrastructure/.*\.tf$
        stages: [pre-commit]
      - id: tofu-validate
        name: OpenTofu validate
        entry: bash -c 'cd infrastructure && tofu init -backend=false -input=false >/dev/null && tofu validate'
        language: system
        pass_filenames: false
        files: ^infrastructure/.*\.tf$
        stages: [pre-commit]
      - id: tofu-test
        name: OpenTofu test (mock providers)
        entry: bash -c 'cd infrastructure && tofu init -backend=false -input=false >/dev/null && tofu test'
        language: system
        pass_filenames: false
        files: ^infrastructure/.*\.(tf|tftest\.hcl)$
        stages: [pre-commit]

  # TFLint + Trivy over infrastructure/; CI's prek job skips it for its own iac job.
  - repo: local
    hooks:
      - id: iac
        name: TFLint + Trivy (infrastructure)
        entry: scripts/quality/iac.sh
        language: system
        pass_filenames: false
        files: ^(infrastructure/.*\.tf|\.tflint\.hcl|\.trivyignore\.yaml|scripts/quality/iac\.sh)$
        stages: [pre-commit]

  # OpenGrep SAST; CI's prek job skips it for gate.yml's opengrep job. Exclusions: .semgrepignore.
  - repo: local
    hooks:
      - id: opengrep
        name: OpenGrep
        entry: scripts/quality/opengrep.sh
        language: system
        pass_filenames: false
        stages: [pre-commit]
