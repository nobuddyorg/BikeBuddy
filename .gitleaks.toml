# False positives: docs/how-to/developer-guide.md, "Secret scanning".
[extend]
useDefault = true

[[rules]]
id = "azure-cosmos-connection-string"
description = "Cosmos DB connection string with an account key for a hosted (*.documents.azure.com) account"
regex = '''AccountEndpoint=https://[a-z0-9-]+\.documents\.azure\.com(?::\d+)?/?;\s*AccountKey=([A-Za-z0-9+/]{86}==)'''
secretGroup = 1
keywords = ["documents.azure.com"]

[[rules]]
id = "azure-storage-connection-string"
description = "Storage connection string with an account key (*.core.windows.net)"
regex = '''(?i)AccountName=[a-z0-9]{3,24};\s*AccountKey=([A-Za-z0-9+/]{86}==)'''
secretGroup = 1
keywords = ["accountkey"]

[[rules]]
id = "azure-storage-sas"
description = "Shared access signature for an Azure Storage account (URL or SharedAccessSignature= setting)"
regex = '''(?i)(?:[a-z0-9]{3,24}\.(?:blob|queue|table|file|dfs)\.core\.windows\.net/[^\s"'<>]*\?|SharedAccessSignature=)[^\s"'<>]*\bsig=([A-Za-z0-9%+/=]{40,})'''
secretGroup = 1
keywords = ["sig="]

# Matched by content, so the public emulator key is exempt wherever it appears and nothing else is.
[[allowlists]]
description = "Cosmos DB emulator key: public by design"
targetRules = ["generic-api-key", "azure-cosmos-connection-string", "azure-storage-connection-string"]
regexes = ['''^C2y6yDjf5/R\+ob0N8A7Cgv30VRDJIWEHLM\+4QDU5DE2nQ9nDuVTqobD4b5n5NVmBSuvpToAw==$''']

[[allowlists]]
description = "Paging test fixture: base64url of the made-up Cosmos-style token '-RID:~ab#RT:1', not a key"
targetRules = ["generic-api-key"]
regexes = ['''^LVJJRDp-YWIjUlQ6MQ$''']
