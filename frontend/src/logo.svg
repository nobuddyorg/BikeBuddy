    <path d="M178 160 L240 160 L232 204 L188 204 Z" fill="#d6981f" stroke="#1b1002" stroke-width="7"/>
    <path d="M192 172 H228 M190 184 H226 M188 196 H222" stroke="#1b1002" stroke-width="4"/>
