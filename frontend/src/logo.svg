      <path d="M104 197 V247 M82 210 L126 234 M82 234 L126 210 M286 197 V247 M264 210 L308 234 M264 234 L308 210" stroke-width="4"/>
    </g>
    <circle cx="104" cy="222" r="8" fill="#f2b632" stroke="#1b1002" stroke-width="4"/>
