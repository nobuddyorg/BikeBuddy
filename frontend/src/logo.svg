    <path d="M104 222 L186 196" stroke="#f2b632" stroke-width="9"/>
    <path d="M258 122 L286 222" stroke="#f2b632" stroke-width="10"/>
    <path d="M258 122 L286 222" stroke="#1b1002" stroke-width="3"/>
    <!-- exhaust -->
    <path d="M206 204 L150 200 L86 186" fill="none" stroke="#f2b632" stroke-width="11"/>
    <path d="M206 204 L150 200 L86 186" fill="none" stroke="#1b1002" stroke-width="3"/>
