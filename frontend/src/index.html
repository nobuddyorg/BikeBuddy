<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Page zoom stays enabled; the map handles its own pinch in ui/map.js. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages cannot send headers, so the policy is a meta tag (docs/explanation/security.md). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.blob.core.windows.net http://127.0.0.1:10000; connect-src 'self' https://*.ciamlogin.com https://login.microsoftonline.com https://*.azurewebsites.net https://*.blob.core.windows.net http://127.0.0.1:10000; frame-src https://*.ciamlogin.com https://login.microsoftonline.com; font-src 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>BikeBuddy</title>
    <meta
      name="description"
      content="Upload GPX rides (cycling or motorcycling) and see your routes on the map."
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta property="og:title" content="BikeBuddy" />
    <meta property="og:description" content="Upload GPX rides and see your routes on the map." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nobuddy.org/BikeBuddy/" />
    <meta name="twitter:card" content="summary" />

    <!-- defer keeps document order, so the module app.js still runs after Leaflet and MSAL. -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <script src="vendor/leaflet/leaflet.js" defer></script>
    <!-- Vendored: loading MSAL from a CDN was blocked (ORB) on GitHub Pages. -->
    <script src="vendor/msal-browser.min.js" defer></script>
    <script src="config.js" defer></script>

    <!-- Linked in this order, which is the cascade order; no @import, so they load in parallel. -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/tours-and-map.css" />
    <link rel="stylesheet" href="css/panels.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/photos.css" />
    <link rel="stylesheet" href="css/feedback.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/language-and-utilities.css" />
  </head>
  <body class="i18n-loading">
    <!-- Shown until ui/i18n.js has translated the markup it covers. -->
    <div id="app-skeleton" class="app-skeleton" aria-hidden="true">
      <div class="skeleton-navbar">
        <div class="skeleton-block skeleton-navbar-logo"></div>
        <div class="skeleton-block skeleton-navbar-action"></div>
      </div>
      <div class="skeleton-body">
        <div class="skeleton-sidebar">
          <div class="skeleton-block skeleton-line"></div>
          <div class="skeleton-block skeleton-row"></div>
          <div class="skeleton-block skeleton-row"></div>
          <div class="skeleton-block skeleton-row"></div>
          <div class="skeleton-block skeleton-row"></div>
        </div>
        <div class="skeleton-block skeleton-map"></div>
      </div>
    </div>

    <header class="navbar">
      <!-- The page's one h1: the visible brand is a reload button, which cannot hold a heading. -->
      <h1 class="visually-hidden">BikeBuddy</h1>
      <button
        id="btn-brand-reload"
        type="button"
        class="navbar-brand"
        data-i18n-aria-label="nav.reloadAria"
        data-i18n-title="nav.reloadAria"
      >
        <img class="navbar-logo" src="favicon.png" alt="" />
        <span class="navbar-title"
          ><span class="navbar-title-ruled">Bike</span
          ><span class="navbar-title-accent">Buddy</span></span
        >
      </button>
      <div class="navbar-actions">
        <button
          id="btn-help"
          class="btn btn-ghost"
          data-i18n-aria-label="nav.helpAria"
          data-i18n-title="nav.helpTitle"
        >
          ?
        </button>
        <button
          id="btn-upload"
          class="btn btn-secondary"
          disabled
          data-i18n="nav.upload"
          data-i18n-title="nav.uploadDisabledTitle"
        ></button>
        <button id="btn-login" class="btn btn-primary" data-i18n="nav.signIn"></button>
        <div id="user-menu" class="user-menu hidden">
          <button
            id="btn-profile"
            class="btn btn-ghost"
            data-i18n-aria-label="nav.profileAria"
          ></button>
        </div>
      </div>
    </header>

    <!-- One main for the whole app: on mobile the map is off-screen, so it cannot be the main. -->
    <main id="app-layout" class="app-layout">
      <section id="sidebar" class="sidebar" aria-labelledby="sidebar-title">
        <div class="sidebar-header">
          <div class="sidebar-header-title">
            <h2 id="sidebar-title" data-i18n="sidebar.myTours"></h2>
            <span id="tour-count" class="badge">0</span>
            <button
              id="btn-stats-header"
              type="button"
              class="btn btn-ghost stats-header-btn"
              data-i18n-aria-label="stats.openAria"
              data-i18n-title="stats.openAria"
            >
              <svg fill="currentColor" aria-hidden="true"><use href="icons.svg#stats" /></svg>
            </button>
          </div>
          <button
            id="btn-select-mode"
            class="btn btn-ghost hidden"
            data-i18n="sidebar.select"
          ></button>
        </div>

        <div id="auth-prompt" class="auth-prompt">
          <p data-i18n="sidebar.signInPrompt"></p>
          <button
            class="btn btn-primary btn-full"
            id="btn-login-sidebar"
            data-i18n="nav.signIn"
          ></button>
        </div>

        <div id="tour-loading" class="tour-loading hidden">
          <span class="spinner" aria-hidden="true"></span>
          <span data-i18n="sidebar.loading"></span>
        </div>

        <div id="tour-controls" class="tour-controls hidden">
          <div class="tour-search-wrap">
            <input
              id="tour-search"
              type="search"
              class="tour-search"
              data-i18n-placeholder="sidebar.searchPlaceholder"
              data-i18n-aria-label="sidebar.searchAria"
              autocomplete="off"
            />
            <button
              id="tour-search-clear"
              type="button"
              class="tour-search-clear hidden"
              data-i18n-aria-label="sidebar.searchClearAria"
              data-i18n-title="sidebar.searchClearAria"
            >
              <svg aria-hidden="true"><use href="icons.svg#close" /></svg>
            </button>
          </div>
          <select id="tour-sort" class="tour-sort" data-i18n-aria-label="sidebar.sortAria"></select>
          <div id="sort-menu" class="sort-menu">
            <button
              id="btn-sort-menu"
              type="button"
              class="btn btn-ghost sort-menu-btn"
              aria-haspopup="listbox"
              aria-expanded="false"
              data-i18n-aria-label="sidebar.sortAria"
              data-i18n-title="sidebar.sortAria"
            >
              <svg aria-hidden="true"><use href="icons.svg#sort" /></svg>
            </button>
            <ul
              id="sort-menu-list"
              class="sort-menu-list hidden"
              role="listbox"
              data-i18n-aria-label="sidebar.sortAria"
            ></ul>
          </div>
          <button
            id="btn-stats"
            type="button"
            class="btn btn-ghost tour-stats-btn"
            data-i18n-aria-label="stats.openAria"
            data-i18n-title="stats.openAria"
          >
            <svg fill="currentColor" aria-hidden="true"><use href="icons.svg#stats" /></svg>
          </button>
        </div>

        <div id="selection-bar" class="selection-bar hidden">
          <span id="selection-count" class="selection-count"></span>
          <div class="selection-bar-actions">
            <button
              id="btn-delete-selected"
              class="btn btn-danger"
              data-i18n-aria-label="sidebar.deleteSelected"
            >
              <span class="btn-icon" aria-hidden="true">
                <svg fill="currentColor"><use href="icons.svg#trash" /></svg>
              </span>
              <span class="btn-label" data-i18n="sidebar.deleteSelected"></span>
            </button>
            <button
              id="btn-cancel-select"
              class="btn btn-ghost"
              data-i18n-aria-label="sidebar.cancelSelect"
            >
              <span class="btn-icon" aria-hidden="true">✕</span>
              <span class="btn-label" data-i18n="sidebar.cancelSelect"></span>
            </button>
          </div>
        </div>

        <ul id="tour-list" class="tour-list hidden"></ul>

        <div id="tour-pager" class="tour-pager hidden">
          <button
            id="tour-pager-prev"
            class="btn btn-ghost"
            data-i18n-aria-label="sidebar.pagerPrevAria"
          >
            ‹
          </button>
          <span id="tour-pager-label" class="tour-pager-label"></span>
          <button
            id="tour-pager-next"
            class="btn btn-ghost"
            data-i18n-aria-label="sidebar.pagerNextAria"
          >
            ›
          </button>
        </div>

        <button id="btn-show-all" class="show-all-btn hidden" data-i18n="tours.showAll"></button>

        <div id="no-tours" class="empty-state hidden">
          <p data-i18n="sidebar.noToursYet"></p>
          <button
            class="btn btn-primary btn-full"
            id="btn-upload-sidebar"
            data-i18n="sidebar.uploadFirst"
          ></button>
        </div>

        <div id="tour-load-error" class="empty-state hidden">
          <p data-i18n="sidebar.loadError"></p>
          <button
            class="btn btn-primary btn-full"
            id="btn-retry-tours"
            data-i18n="sidebar.retry"
          ></button>
        </div>
      </section>

      <div id="map-container" class="map-container">
        <div id="map"></div>
        <div class="map-top-controls">
          <label
            id="filter-in-view-toggle"
            class="pin-toggle hidden"
            data-i18n-aria-label="sidebar.filterInView"
          >
            <input type="checkbox" id="filter-in-view-input" />
            <span
              ><span class="btn-icon" aria-hidden="true">
                <svg><use href="icons.svg#in-view" /></svg>
              </span>
              <span class="toggle-label-text" data-i18n="sidebar.filterInView"></span
            ></span>
          </label>
          <label id="pin-toggle" class="pin-toggle hidden" data-i18n-aria-label="map.photoPins">
            <input type="checkbox" id="pin-toggle-input" />
            <span
              ><span class="btn-icon" aria-hidden="true">
                <svg><use href="icons.svg#camera" /></svg>
              </span>
              <span class="toggle-label-text" data-i18n="map.photoPins"></span
            ></span>
          </label>
          <div id="line-style-wrap" class="line-style-wrap hidden">
            <button
              id="btn-line-style"
              type="button"
              class="pin-toggle"
              aria-haspopup="dialog"
              aria-expanded="false"
              data-i18n-aria-label="map.lineStyle"
            >
              <span class="btn-icon" aria-hidden="true">
                <svg><use href="icons.svg#line-style" /></svg>
              </span>
              <span class="toggle-label-text" data-i18n="map.lineStyle"></span>
            </button>
            <div
              id="line-style-menu"
              class="line-style-menu hidden"
              role="dialog"
              data-i18n-aria-label="map.lineStyle"
            >
              <label class="line-style-field">
                <span data-i18n="map.lineStyleColor"></span>
                <input id="line-style-color" type="color" />
              </label>
              <label class="line-style-field">
                <span data-i18n="map.lineStyleWidth"></span>
                <input id="line-style-width" type="range" step="1" />
                <span id="line-style-width-value" class="line-style-value"></span>
              </label>
              <label class="line-style-field">
                <span data-i18n="map.lineStyleOpacity"></span>
                <input id="line-style-opacity" type="range" step="5" />
                <span id="line-style-opacity-value" class="line-style-value"></span>
              </label>
            </div>
          </div>
          <button
            id="btn-map-expand"
            class="map-expand-btn"
            data-i18n-aria-label="map.expandAria"
            data-i18n-title="map.expandTitle"
            aria-pressed="false"
          >
            <span class="btn-icon" aria-hidden="true">
              <svg><use href="icons.svg#expand" /></svg>
            </span>
          </button>
        </div>
        <div id="map-empty" class="map-empty-overlay hidden">
          <div class="map-empty-card">
            <div class="map-empty-icon">🗺️</div>
            <h3 data-i18n="map.emptyTitle"></h3>
            <p data-i18n="map.emptyBody"></p>
          </div>
        </div>
        <div id="map-load-error" class="map-empty-overlay hidden">
          <div class="map-empty-card">
            <div class="map-empty-icon">⚠️</div>
            <h3 data-i18n="map.loadErrorTitle"></h3>
            <button class="btn btn-primary" id="btn-retry-map" data-i18n="sidebar.retry"></button>
          </div>
        </div>
        <div id="map-loading" class="map-empty-overlay hidden">
          <div class="map-empty-card map-loading-card">
            <span class="spinner" aria-hidden="true"></span>
            <span data-i18n="map.loading"></span>
          </div>
        </div>
      </div>

      <section id="detail-panel" class="detail-panel hidden" aria-labelledby="detail-name">
        <button id="btn-close-detail" class="detail-close" data-i18n-aria-label="common.close">
          ✕
        </button>
        <h2 id="detail-name" class="detail-title"></h2>
        <dl class="detail-meta">
          <dt data-i18n="detail.date"></dt>
          <dd id="detail-date">—</dd>
          <dt data-i18n="detail.distance"></dt>
          <dd id="detail-distance">—</dd>
          <dt data-i18n="detail.elevationGain"></dt>
          <dd id="detail-elevation-gain">—</dd>
          <dt data-i18n="detail.duration"></dt>
          <dd id="detail-duration">—</dd>
          <dt data-i18n="detail.avgSpeed"></dt>
          <dd id="detail-avg-speed">—</dd>
        </dl>
        <p id="detail-description" class="detail-description"></p>

        <section class="tour-images">
          <h3 class="images-title" data-i18n="detail.photos"></h3>
          <div id="tour-image-grid" class="image-grid"></div>
          <div
            id="image-dropzone"
            class="dropzone dropzone-sm"
            tabindex="0"
            role="button"
            data-i18n-aria-label="detail.addPhotosAria"
          >
            <input id="image-file" type="file" accept="image/jpeg,image/png" multiple hidden />
            <p class="dropzone-text" data-i18n="detail.dropPhotos"></p>
          </div>
          <p id="image-error" class="upload-error hidden" role="alert"></p>
        </section>

        <div class="detail-actions">
          <button
            id="btn-edit-tour"
            class="btn btn-secondary btn-full"
            data-i18n="detail.edit"
          ></button>
          <button
            id="btn-download-gpx"
            class="btn btn-secondary btn-full"
            data-i18n="detail.downloadGpx"
          ></button>
          <button
            id="btn-delete-tour"
            class="btn btn-danger btn-full"
            data-i18n="detail.deleteTour"
          ></button>
        </div>
      </section>

      <button
        id="btn-mobile-map-fab"
        class="mobile-map-fab hidden"
        data-i18n-aria-label="map.expandAria"
        data-i18n-title="map.expandTitle"
      >
        <svg aria-hidden="true"><use href="icons.svg#map" /></svg>
      </button>
    </main>

    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <div
      id="help-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="help-modal-title"
    >
      <div class="modal help-modal">
        <button id="btn-close-help" class="modal-close" data-i18n-aria-label="common.close">
          ✕
        </button>
        <h2 id="help-modal-title" class="profile-name" data-i18n="help.title"></h2>
        <!-- Focusable so keyboard users can scroll it; it holds no controls. -->
        <div class="help-content" tabindex="0" role="region" aria-labelledby="help-modal-title">
          <h3 data-i18n="help.q1"></h3>
          <p data-i18n="help.a1"></p>
          <h3 data-i18n="help.q2"></h3>
          <p data-i18n-html="help.a2"></p>
          <h3 data-i18n="help.q3"></h3>
          <p data-i18n-html="help.a3"></p>
          <h3 data-i18n="help.q4"></h3>
          <p data-i18n-html="help.a4"></p>
          <h3 data-i18n="help.q5"></h3>
          <p data-i18n-html="help.a5"></p>
          <h3 data-i18n="help.q6"></h3>
          <p data-i18n-html="help.a6"></p>
          <h3 data-i18n="help.q7"></h3>
          <p data-i18n-html="help.a7"></p>
          <h3 data-i18n="help.q8"></h3>
          <p data-i18n="help.a8"></p>
        </div>
      </div>
    </div>

    <div
      id="profile-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="profile-modal-title"
    >
      <div class="modal">
        <button id="btn-close-profile" class="modal-close" data-i18n-aria-label="common.close">
          ✕
        </button>
        <div id="profile-avatar" class="profile-avatar" aria-hidden="true"></div>
        <h2 id="profile-modal-title" class="profile-name" data-i18n="profile.title"></h2>
        <dl class="profile-meta">
          <dt data-i18n="profile.email"></dt>
          <dd id="profile-email">—</dd>
          <dt data-i18n="profile.memberSince"></dt>
          <dd id="profile-since">—</dd>
          <dt data-i18n="profile.language"></dt>
          <dd>
            <div id="lang-switcher" class="lang-switcher">
              <button
                id="btn-lang"
                class="btn btn-ghost lang-btn"
                aria-haspopup="listbox"
                aria-expanded="false"
                data-i18n-aria-label="profile.langAria"
              ></button>
              <div
                id="lang-menu"
                class="lang-menu hidden"
                role="dialog"
                data-i18n-aria-label="profile.language"
              >
                <input
                  id="lang-search"
                  class="lang-search"
                  type="search"
                  autocomplete="off"
                  data-i18n-placeholder="lang.searchPlaceholder"
                  data-i18n-aria-label="lang.searchAria"
                />
                <ul id="lang-list" class="lang-list" role="listbox"></ul>
              </div>
            </div>
          </dd>
        </dl>
        <form id="profile-name-form" class="upload-form">
          <label class="field">
            <span data-i18n="profile.displayName"></span>
            <input
              id="profile-name-input"
              type="text"
              maxlength="200"
              data-i18n-placeholder="profile.namePlaceholder"
            />
          </label>
          <p id="profile-name-error" class="upload-error hidden" role="alert"></p>
          <button
            id="btn-save-profile-name"
            type="submit"
            class="btn btn-secondary btn-full"
            data-i18n="profile.saveName"
          ></button>
        </form>
        <div class="profile-actions">
          <button
            id="btn-logout"
            class="btn btn-secondary btn-full"
            data-i18n="nav.signOut"
          ></button>
          <button
            id="btn-export-data"
            class="btn btn-secondary btn-full"
            data-i18n="profile.exportData"
          ></button>
        </div>
        <div class="profile-danger-zone">
          <h3 data-i18n="profile.dangerZone"></h3>
          <button
            id="btn-delete-account"
            class="btn btn-danger btn-full"
            data-i18n="profile.deleteAccount"
          ></button>
        </div>
      </div>
    </div>

    <div
      id="upload-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="upload-modal-title"
    >
      <div class="modal">
        <button id="btn-close-upload" class="modal-close" data-i18n-aria-label="common.close">
          ✕
        </button>
        <h2 id="upload-modal-title" class="profile-name" data-i18n="upload.title"></h2>
        <form id="upload-form" class="upload-form">
          <label class="field">
            <span data-i18n="upload.name"></span>
            <input
              id="upload-name"
              type="text"
              maxlength="200"
              data-i18n-placeholder="upload.namePlaceholder"
            />
          </label>
          <label class="field">
            <span data-i18n="upload.description"></span>
            <textarea
              id="upload-description"
              rows="2"
              maxlength="2000"
              data-i18n-placeholder="upload.descPlaceholder"
            ></textarea>
          </label>
          <div
            id="dropzone"
            class="dropzone"
            tabindex="0"
            role="button"
            data-i18n-aria-label="upload.chooseAria"
          >
            <input id="upload-file" type="file" accept=".gpx" hidden />
            <p class="dropzone-text" data-i18n-html="upload.dropText"></p>
            <p id="dropzone-filename" class="dropzone-filename hidden"></p>
          </div>
          <div id="upload-progress" class="progress hidden">
            <div id="upload-progress-bar" class="progress-bar"></div>
          </div>
          <p id="upload-error" class="upload-error hidden" role="alert"></p>
          <button
            id="btn-submit-upload"
            type="submit"
            class="btn btn-primary btn-full"
            disabled
            data-i18n="upload.submit"
          ></button>
        </form>
      </div>
    </div>

    <div
      id="lightbox"
      class="modal-overlay lightbox hidden"
      role="dialog"
      aria-modal="true"
      data-i18n-aria-label="lightbox.aria"
    >
      <button
        id="btn-lightbox-delete"
        type="button"
        class="lightbox-icon-btn lightbox-delete hidden"
        data-i18n-aria-label="lightbox.deleteAria"
        data-i18n-title="lightbox.deleteAria"
      >
        <svg fill="currentColor" aria-hidden="true"><use href="icons.svg#trash" /></svg>
      </button>
      <button
        id="btn-close-lightbox"
        type="button"
        class="lightbox-icon-btn lightbox-close"
        data-i18n-aria-label="common.close"
      >
        <svg aria-hidden="true"><use href="icons.svg#close" /></svg>
      </button>
      <div id="lightbox-stage" class="lightbox-stage">
        <img id="lightbox-img" data-i18n-alt="lightbox.imgAlt" alt="Tour photo" />
        <div id="lightbox-error" class="lightbox-error hidden">
          <p data-i18n="detail.photoLoadError"></p>
          <button
            type="button"
            id="btn-lightbox-retry"
            class="btn btn-secondary"
            data-i18n="lightbox.retry"
          ></button>
        </div>
      </div>
      <div id="lightbox-navbar" class="lightbox-navbar">
        <button
          id="btn-lightbox-prev"
          type="button"
          class="lightbox-nav-btn"
          data-i18n-aria-label="lightbox.prevAria"
        >
          <svg aria-hidden="true"><use href="icons.svg#chevron-left" /></svg>
        </button>
        <span id="lightbox-counter" class="lightbox-counter" aria-live="polite"></span>
        <button
          id="btn-lightbox-next"
          type="button"
          class="lightbox-nav-btn"
          data-i18n-aria-label="lightbox.nextAria"
        >
          <svg aria-hidden="true"><use href="icons.svg#chevron-right" /></svg>
        </button>
      </div>
    </div>

    <div
      id="edit-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-modal-title"
    >
      <div class="modal">
        <button id="btn-close-edit" class="modal-close" data-i18n-aria-label="common.close">
          ✕
        </button>
        <h2 id="edit-modal-title" class="profile-name" data-i18n="edit.title"></h2>
        <form id="edit-form" class="upload-form">
          <label class="field">
            <span data-i18n="edit.name"></span>
            <input id="edit-name" type="text" maxlength="200" required />
          </label>
          <label class="field">
            <span data-i18n="edit.date"></span>
            <input id="edit-date" type="date" required />
          </label>
          <label class="field">
            <span data-i18n="edit.description"></span>
            <textarea id="edit-description" rows="2" maxlength="2000"></textarea>
          </label>
          <p id="edit-error" class="upload-error hidden" role="alert"></p>
          <button
            id="btn-submit-edit"
            type="submit"
            class="btn btn-primary btn-full"
            data-i18n="edit.save"
          ></button>
        </form>
      </div>
    </div>

    <div
      id="confirm-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-modal-title"
    >
      <div class="modal confirm-modal">
        <button id="btn-close-confirm" class="modal-close" data-i18n-aria-label="common.close">
          ✕
        </button>
        <h2 id="confirm-modal-title" class="profile-name"></h2>
        <p id="confirm-modal-message"></p>
        <div class="confirm-modal-actions">
          <button
            id="btn-confirm-cancel"
            class="btn btn-secondary"
            data-i18n="common.cancel"
          ></button>
          <button id="btn-confirm-ok" class="btn btn-danger"></button>
        </div>
      </div>
    </div>

    <div
      id="delete-account-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-account-modal-title"
    >
      <div class="modal">
        <button
          id="btn-close-delete-account"
          class="modal-close"
          data-i18n-aria-label="common.close"
        >
          ✕
        </button>
        <h2
          id="delete-account-modal-title"
          class="profile-name"
          data-i18n="confirm.deleteAccountTitle"
        ></h2>
        <p data-i18n="confirm.deleteAccount"></p>
        <label class="field">
          <span id="delete-account-hint"></span>
          <input id="delete-account-input" type="text" autocomplete="off" />
        </label>
        <button
          id="btn-delete-account-confirm"
          class="btn btn-danger btn-full"
          disabled
          data-i18n="profile.deleteAccount"
        ></button>
      </div>
    </div>

    <div
      id="stats-modal"
      class="modal-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="stats-modal-title"
    >
      <div class="modal stats-modal">
        <button id="btn-close-stats" class="modal-close" data-i18n-aria-label="common.close">
          ✕
        </button>
        <h2 id="stats-modal-title" class="profile-name" data-i18n="stats.title"></h2>
        <dl class="stats-grid">
          <div class="stat-tile">
            <dt data-i18n="stats.totalDistance"></dt>
            <dd id="stats-total-distance">—</dd>
          </div>
          <div class="stat-tile">
            <dt data-i18n="stats.totalRides"></dt>
            <dd id="stats-total-count">—</dd>
          </div>
          <div class="stat-tile">
            <dt data-i18n="stats.thisYear"></dt>
            <dd id="stats-this-year">—</dd>
          </div>
          <div class="stat-tile">
            <dt data-i18n="stats.lastYear"></dt>
            <dd id="stats-last-year">—</dd>
          </div>
          <div class="stat-tile">
            <dt data-i18n="stats.average"></dt>
            <dd id="stats-average">—</dd>
          </div>
        </dl>
        <button id="btn-stats-longest" type="button" class="stats-longest hidden">
          <span data-i18n="stats.longest"></span>
          <span id="stats-longest-detail"></span>
        </button>
        <p id="stats-empty" class="stats-empty hidden" data-i18n="stats.noRides"></p>
        <ul id="stats-per-year" class="stats-per-year"></ul>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
