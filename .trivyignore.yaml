# One entry per accepted finding, with its reason (design-decisions.md, "IaC scan exceptions").
misconfigurations:
  - id: AZU-0012
    paths: ["storage.tf"]
    statement: >-
      Storage must stay reachable from browsers: photos are served to the SPA by
      short-lived SAS URLs, and Flex Consumption without VNet integration (a paid
      add-on) reaches it over the public endpoint. Access is key/SAS-only, TLS 1.2,
      no public containers. Managed identity instead of keys: #556.
  - id: AZU-0057
    paths: ["storage.tf"]
    statement: >-
      Storage analytics logging is billed per GB and not read by anyone today;
      recovery relies on blob soft delete and versioning (#541), not logs.
  - id: AZU-0058
    paths: ["storage.tf"]
    statement: >-
      LRS, not GRS, to stay inside the cost target. Soft delete and versioning
      (#541) recover deleted or overwritten blobs; losing the region is accepted.
  - id: AZU-0060
    paths: ["storage.tf"]
    statement: >-
      Microsoft-managed keys by design (design-decisions.md, "Encryption at rest"):
      a customer-managed key needs Key Vault, above the cost target.
  - id: AZU-0061
    paths: ["storage.tf"]
    statement: >-
      Infrastructure encryption is fixed at account creation; not retrofitted to the
      existing account (design-decisions.md, "Encryption at rest").
